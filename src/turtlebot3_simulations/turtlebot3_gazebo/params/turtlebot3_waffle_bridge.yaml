# ==============================================================================
# ROS 2 - Gazebo Ignition Parameter Bridge Configuration
# Namespace: /our_bot
# ==============================================================================

# Global simulation clock (shared across system)
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Joint states scoped to robot namespace
- ros_topic_name: "/our_bot/joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Odometry data scoped to robot namespace
- ros_topic_name: "/our_bot/odom"
  gz_topic_name: "/our_bot/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Global transform topic (receives Gazebo pose broadcats)
- ros_topic_name: "tf"
  gz_topic_name: "tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Command velocity input (Unstamped Twist for compatibility)
- ros_topic_name: "/our_bot/cmd_vel"
  gz_topic_name: "/our_bot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# IMU sensor data scoped to robot namespace
- ros_topic_name: "/our_bot/imu"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Laser scan data scoped to robot namespace
- ros_topic_name: "/our_bot/scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Camera info scoped to robot namespace
- ros_topic_name: "/our_bot/camera/camera_info"
  gz_topic_name: "camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS