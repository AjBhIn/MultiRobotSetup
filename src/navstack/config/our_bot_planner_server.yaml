# ==============================================================================
# Global Planner Server & Costmap Configuration
# DIFFERENCE FROM STANDARD:
# 1. Root nodes scoped under 'our_bot/planner_server' and 'our_bot/global_costmap'.
# 2. GridBased plugin uses 'nav2_navfn_planner/NavfnPlanner' (slash pluginlib format).
# 3. robot_base_frame set to 'our_bot/base_footprint'.
# 4. Explicit sensor_frame 'our_bot/base_scan' in obstacle layer.
# 5. transform_tolerance set to 5.0 to give AMCL time during state transitions.
# ==============================================================================
our_bot/planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner" # Uses forward slash syntax for ROS 2 pluginlib
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

our_bot/global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      map_topic: /map
      robot_base_frame: our_bot/base_footprint # Prefixed base frame
      transform_tolerance: 5.0                  # Tolerates initial AMCL pose seeding delay
      use_sim_time: True
      resolution: 0.05
      footprint: '[ [0.15, 0.12], [0.15, -0.12], [-0.15, -0.12], [-0.15, 0.12] ]'
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: "/map"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.35
      always_send_full_costmap: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /our_bot/scan
          sensor_frame: our_bot/base_scan # Explicitly declared to avoid TF lookup drops
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0